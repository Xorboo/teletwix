[package]
name = "teletwix"
version = "0.2.0"
edition = "2024"
authors = ["Xorboo <xorboo@gmail.com>"]
description = "Tiny Telegram bot to reply to twitter/x links with fxtwitter.com links for better previews"
repository = "https://github.com/xorboo/teletwix"
license = "MIT"
keywords = ["telegram", "bot", "rust", "teloxide", "twitter"]

[dependencies]
teloxide = "0.17"
log = "0.4"
pretty_env_logger = "0.5"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
regex = "1.13"
dotenvy = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
